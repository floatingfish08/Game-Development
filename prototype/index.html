<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071116" />
    <meta name="description" content="Blackout Ridge multiplayer UX prototype" />
    <title>Blackout Ridge — Relay Console</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="stylesheet" href="./styles.css?v=20260825-1" />
  </head>
  <body>
    <div class="weather" aria-hidden="true"></div>
    <div id="app"></div>
    <noscript>Blackout Ridge requires JavaScript for synchronized prototype state.</noscript>
    <script>
      function showBootError(title, message) {
        var app = document.querySelector("#app");
        if (!app || app.dataset.ready === "1") return;
        app.innerHTML = '<main class="error-main"><p class="eyebrow">' + title + '</p><h1>' + String(message) + '</h1></main>';
      }
      window.addEventListener("error", function (event) {
        showBootError("CLIENT ERROR", event.message);
      });
      window.addEventListener("unhandledrejection", function (event) {
        showBootError("CONNECTION ERROR", event.reason && event.reason.message || event.reason);
      });
    </script>
    <script type="module" src="./full-app.js?v=20260825-1"></script>
  </body>
</html>
