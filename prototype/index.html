<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071116" />
    <meta name="description" content="Blackout Ridge multiplayer UX prototype" />
    <title>Blackout Ridge — Relay Console</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/images/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="weather" aria-hidden="true"></div>
    <div id="app"></div>
    <noscript>Blackout Ridge requires JavaScript for synchronized prototype state.</noscript>
    <script>
      window.addEventListener("error", function (event) {
        document.querySelector("#app").innerHTML = '<main class="error-main"><p class="eyebrow">CLIENT ERROR</p><h1>' + String(event.message) + '</h1></main>';
      });
      window.addEventListener("unhandledrejection", function (event) {
        document.querySelector("#app").innerHTML = '<main class="error-main"><p class="eyebrow">CONNECTION ERROR</p><h1>' + String(event.reason && event.reason.message || event.reason) + '</h1></main>';
      });
    </script>
    <script type="module" src="./full-app.js"></script>
  </body>
</html>
